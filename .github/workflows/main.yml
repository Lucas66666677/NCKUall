name: CI

on:
  push:
    branches:
      - main
  # Deliberately unfiltered. This repo uses stacked pull requests, where one PR
  # is based on another PR's branch rather than on main. Under a
  # `branches: [main]` filter those PRs matched nothing and ran no backend or
  # frontend job at all, so stacked work could reach main having never been
  # tested on its own.
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nckuall_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nckuall_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install flake8

      - name: Compile Python files
        working-directory: backend
        run: python -m compileall app scripts

      - name: Run flake8 critical checks
        working-directory: backend
        run: flake8 app scripts tests --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Apply Alembic migrations to the integration database
        working-directory: backend
        env:
          PGPASSWORD: postgres
        run: |
          # Keep the migration proof isolated: pytest owns nckuall_test and
          # expects an empty schema for each run.
          psql -h 127.0.0.1 -U postgres -d postgres -c "CREATE DATABASE nckuall_migration_test"
          DATABASE_URL=postgresql+psycopg://postgres:postgres@127.0.0.1:5432/nckuall_migration_test python -m alembic upgrade head

      - name: Run backend integration tests
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/nckuall_test
        run: pytest

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint frontend
        run: npm run lint

      - name: Run frontend unit tests
        run: npm test

      - name: Build Next.js app
        env:
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run frontend end-to-end tests
        run: npm run test:e2e
